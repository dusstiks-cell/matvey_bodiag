<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>О разработчиках</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .developers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .developer-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            width: 220px;
            padding: 15px;
            text-align: center;
        }

            .developer-card img {
                width: 100%;
                height: 220px;
                object-fit: cover;
                border-radius: 8px;
                background-color: #ddd;
            }

            .developer-card h2 {
                font-size: 18px;
                margin: 12px 0 6px;
                color: #222;
            }

            .developer-card p {
                margin: 4px 0;
                color: #555;
            }
    </style>
</head>
<body>
    <h1>Информация о разработчиках</h1>

    <div class="developers">

        <!-- Разработчик 1 -->
        <div class="developer-card">
            <img src="1.jpg" alt="Фото 1" />
            <h2>Морозёнок Елизавета Дмитриевна</h2>
            <p>Возраст: 18 лет</p>
        </div>

        <!-- Разработчик 2 -->
        <div class="developer-card">
            <img src="2.jpg" alt="Фото 2" />
            <h2>Полина Кралько Алексеевна</h2>
            <p>Возраст: 18 год</p>
        </div>

        <!-- Разработчик 3 -->
        <div class="developer-card">
            <img src="3.jpg" alt="Фото 3" />
            <h2>Дарья Мясникова Сергеевна</h2>
            <p>Возраст: 17 лет</p>
        </div>

        <!-- Разработчик 4 -->
        <div class="developer-card">
            <img src="4.jpg" alt="Фото 4" />
            <h2>Мария Рабец Леонидовна</h2>
            <p>Возраст: 17 года</p>
        </div>

        <!-- Разработчик 5 -->
        <div class="developer-card">
            <img src="5.jpg" alt="Фото 5" />
            <h2>Евгения Матюш Евгеньевна</h2>
            <p>Возраст: 17 лет</p>
        </div>

    </div>
</body>
</html>
